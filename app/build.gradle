plugins {
    id 'com.android.application' version '8.2.2'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'com.example.allboxtracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.allboxtracker"
        minSdk 24
        targetSdk 34
        // افزایش خودکار کد نسخه در هر بار ساخت برای نصب مستقیم آپدیت روی نسخه قبلی
        def runNum = System.getenv("GITHUB_RUN_NUMBER")
        versionCode runNum ? runNum.toInteger() + 10 : 10
        versionName "1.${versionCode}"
    }

    signingConfigs {
        debug {
            def ksFile = file("allbox-key.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "allboxpass"
                keyAlias "allboxkey"
                keyPassword "allboxpass"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
