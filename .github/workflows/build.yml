name: Build AllBox APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create and Save Permanent Signing Key
        run: |
          if [ ! -f app/allbox-key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/allbox-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias allboxkey \
              -storepass allboxpass -keypass allboxpass \
              -dname "CN=AllBoxTracker, OU=App, O=AllBox, L=Tehran, S=Tehran, C=IR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/allbox-key.jks
            git commit -m "Save permanent signing key for seamless updates [skip ci]" || true
            git pull --rebase || true
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Configure AndroidX
        run: echo "android.useAndroidX=true" > gradle.properties

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllBox-Tracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
